[package]
name = "screenx"
version = "1.0.0-rc.1"
description = "Local screen capture and annotation"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"

# Two programs. `screenx` is what the user runs and what stays running: tray,
# shortcuts, settings, no renderer. `screenx-capture` is spawned per screenshot
# and exits when the editor closes, which is the only way the GL context's
# memory is ever given back.
[[bin]]
name = "screenx"
path = "src/listener.rs"

[[bin]]
name = "screenx-capture"
path = "src/main.rs"

[dependencies]
screenx-core = { path = "../core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Software rasterised rather than wgpu: the overlay draws one full-screen image
# and a rectangle, so a GPU backend would cost a device, a swapchain and its
# driver allocations for work a blit already does. Memory is the point here.
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "default_fonts",
] }
egui = "0.29"
# Both are the crates Tauri's own plugins wrap, minus the plugin layer.
#
# 0.24 and not 0.19: the older release shows the tray menu with `TrackPopupMenu`
# on its own hidden window and never installs muda's subclass there, and it has
# no `WM_COMMAND` arm of its own — so every selection reached `DefWindowProcW`
# and was dropped. The whole tray menu was inert on Windows. 0.24 calls
# `attach_menu_subclass_for_hwnd`, which is what routes the click.
tray-icon = "0.24"
global-hotkey = "0.6"
# The listener's event loop. It creates no window, so no renderer comes with it
# — that is the difference between a 42 MB idle and a 2 MB one. Already in the
# tree under eframe, so this costs no extra compilation.
winit = "0.30"
# Glyph outlines for text drawn into the saved image. The geometry is a few
# dozen lines here rather than a rasterisation crate, and the font is the one
# egui already embeds.
ab_glyph = "0.2"

# The maintained fork of `winres`, which is unmaintained. Build-time only: it
# shells out to the SDK's resource compiler and links the result.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Already in the tree underneath eframe; named here to get at the window handle,
# which is the only way to reach the taskbar button. No new code is compiled.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSWindow",
    "NSResponder",
    "NSApplication",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
