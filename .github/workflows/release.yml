name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The two build jobs run at the same time and both upload to the release, so
  # one of them has to create it first. `gh release create` is not safe to race.
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          **macOS.** Download `ScreenX_universal.zip` below. Move `ScreenX.app`
          into your Applications folder. The build is not signed by Apple, so
          macOS blocks a copy you download. Remove the mark one time:

          ```sh
          xattr -dr com.apple.quarantine /Applications/ScreenX.app
          ```

          Then give ScreenX permission in **System Settings** > **Privacy &
          Security** > **Screen Recording**.

          **Windows.** Download `screenx.exe` and run it. There is no installer.
          Windows shows **Windows protected your PC**: click **More info**, then
          **Run anyway**.

          ScreenX has been run on Windows 11 with two monitors. Only that one
          computer was used, so report what you see on other hardware.
          EOF
          gh release create "${{ github.ref_name }}" \
            --title "ScreenX ${{ github.ref_name }}" \
            ${{ contains(github.ref_name, '-') && '--prerelease' || '' }} \
            --notes-file notes.md

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: windows-latest
            rust-targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # No Rust cache here on purpose. This workflow only runs on tags, and an
      # Actions cache is readable from the ref that wrote it, its children, and
      # the default branch — so sibling tags never share one. Every release run
      # logged "No cache found" against a byte-identical key and then spent
      # 1m44s (Windows) uploading 480 MB nothing would read. If release builds
      # need to get faster, warm a cache on master instead.

      # Ad-hoc signature, applied by bundle.sh. It is free and it is not a
      # trusted one, so Gatekeeper still warns — but TCC keys the Screen
      # Recording grant to code identity, and unsigned falls back to the binary
      # hash. Without it every update looks like a new app and the user has to
      # grant the permission again. See docs/TECHNICAL.md, Signing.
      - name: Build the macOS application
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./app/bundle.sh --universal
          ditto -c -k --keepParent 'app/target/ScreenX.app' ScreenX_universal.zip
          gh release upload "${{ github.ref_name }}" ScreenX_universal.zip --clobber

      - name: Build the Windows binary
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo build --release --manifest-path app/Cargo.toml
          gh release upload "${{ github.ref_name }}" app/target/release/screenx.exe --clobber

      # The cask lives in this repository rather than a homebrew-tap one, so
      # the bump needs no cross-repository token. Users pay for that with the
      # explicit URL in `brew tap`. Pre-releases never move the cask.
      - name: Point the Homebrew cask at this release
        if: matrix.platform == 'macos-latest' && !contains(github.ref_name, '-')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha=$(shasum -a 256 ScreenX_universal.zip | cut -d' ' -f1)
          # actions/checkout leaves a detached HEAD at the tag with no local
          # master, so fetch it into one before switching.
          git fetch origin master:master
          git checkout master
          sed -i '' -E "s/^  version \".*\"/  version \"$version\"/" Casks/screenx.rb
          sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/screenx.rb
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore: point the Homebrew cask at $version"
          git push origin master
