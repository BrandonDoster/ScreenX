name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # No Rust cache here on purpose. This workflow only runs on tags, and an
      # Actions cache is readable from the ref that wrote it, its children, and
      # the default branch — so sibling tags never share one. Every release run
      # logged "No cache found" against a byte-identical key and then spent
      # 1m44s (Windows) uploading 480 MB nothing would read. If release builds
      # need to get faster, warm a cache on master instead: add
      # `push: branches: [master]` and guard the tauri-action step with
      # `if: startsWith(github.ref, 'refs/tags/')`.

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc signature. It is free and it is not a trusted one, so
          # Gatekeeper still warns — but TCC keys the Screen Recording grant to
          # code identity, and unsigned falls back to the binary hash. Without
          # this every update looks like a new app and the user has to grant
          # the permission again. See docs/TECHNICAL.md, Signing.
          APPLE_SIGNING_IDENTITY: '-'
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: 'ScreenX ${{ github.ref_name }}'
          releaseBody: |
            **macOS — install with Homebrew. No warning:**

            ```sh
            brew tap brandondoster/screenx https://github.com/BrandonDoster/ScreenX
            brew install --cask screenx
            ```

            Or download `ScreenX_VERSION_universal.dmg` below. These builds are
            not signed by Apple, so macOS warns on a downloaded copy. Remove the
            mark and it starts normally:

            ```sh
            xattr -dr com.apple.quarantine /Applications/ScreenX.app
            ```

            **Windows 11** — the `-setup.exe` installer, or `screenx.exe` to run
            portable. Click **More info**, then **Run anyway**.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

      # The bundler only publishes installers, but the binary it produces is
      # already self-contained: its only imports are Windows system DLLs, and
      # the frontend is compiled into it. So ship it as-is for anyone who wants
      # no install. Runs after tauri-action, which is what creates the release.
      - name: Attach the portable Windows binary
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" src-tauri/target/release/screenx.exe --clobber

      # The cask lives in this repository rather than a homebrew-tap one, so
      # the bump needs no cross-repository token. Users pay for that with the
      # explicit URL in `brew tap`. Pre-releases never move the cask.
      - name: Point the Homebrew cask at this release
        if: matrix.platform == 'macos-latest' && !contains(github.ref_name, '-')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dmg=$(find src-tauri/target -name 'ScreenX_*_universal.dmg' | head -1)
          sha=$(shasum -a 256 "$dmg" | cut -d' ' -f1)
          # actions/checkout leaves a detached HEAD at the tag with no local
          # master, so fetch it into one before switching.
          git fetch origin master:master
          git checkout master
          sed -i '' -E "s/^  version \".*\"/  version \"$version\"/" Casks/screenx.rb
          sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/screenx.rb
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore: point the Homebrew cask at $version"
          git push origin master
