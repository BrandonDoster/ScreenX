name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The two build jobs run at the same time and both upload to the release, so
  # one of them has to create it first. `gh release create` is not safe to race.
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          **macOS.** Download `ScreenX_universal.dmg` below. Open it and drag
          `ScreenX.app` onto the Applications folder. Then run this one command:

          ```sh
          xattr -dr com.apple.quarantine /Applications/ScreenX.app
          ```

          ScreenX is not signed by Apple, so macOS marks a copy you download and
          refuses to open it, offering to move it to the Trash instead. The
          command removes the mark. You do this once per install.

          There is no Homebrew cask. Homebrew is ending support for casks that
          fail Gatekeeper, and signing needs a paid Apple Developer ID.

          ScreenX asks for Screen Recording permission the first time you take a
          screenshot. Turn on **ScreenX** in **System Settings** > **Privacy &
          Security** > **Screen Recording**, then take the screenshot again.

          **Windows.** Download `ScreenX_windows.zip` and extract it. There is
          no installer. Keep both files in the same folder and run
          `screenx.exe`.

          ScreenX is two programs. `screenx.exe` holds the tray icon and the
          shortcuts, and it starts `screenx-capture.exe` beside it for each
          screenshot. Separate the two files and the shortcuts do nothing.

          Windows shows **Windows protected your PC**: click **More info**, then
          **Run anyway**.

          ScreenX has been run on Windows 11 with two monitors. Only that one
          computer was used, so report what you see on other hardware.
          EOF
          gh release create "${{ github.ref_name }}" \
            --title "ScreenX ${{ github.ref_name }}" \
            ${{ contains(github.ref_name, '-') && '--prerelease' || '' }} \
            --notes-file notes.md

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: windows-latest
            rust-targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # No Rust cache here on purpose. This workflow only runs on tags, and an
      # Actions cache is readable from the ref that wrote it, its children, and
      # the default branch — so sibling tags never share one. Every release run
      # logged "No cache found" against a byte-identical key and then spent
      # 1m44s (Windows) uploading 480 MB nothing would read. If release builds
      # need to get faster, warm a cache on master instead.

      # Ad-hoc signature, applied by bundle.sh. It is free and it is not a
      # trusted one, so Gatekeeper still warns — but TCC keys the Screen
      # Recording grant to code identity, and unsigned falls back to the binary
      # hash. Without it every update looks like a new app and the user has to
      # grant the permission again. See docs/TECHNICAL.md, Signing.
      - name: Build the macOS application
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./app/bundle.sh --universal
          # A .dmg rather than a plain archive: it carries the Applications
          # symlink, so installing is one drag and the user never has to be told
          # where the application goes. Homebrew reads a dmg just as well.
          staging=$(mktemp -d)
          cp -R 'app/target/ScreenX.app' "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname ScreenX -srcfolder "$staging" \
            -ov -format UDZO ScreenX_universal.dmg
          gh release upload "${{ github.ref_name }}" ScreenX_universal.dmg --clobber

      - name: Build the Windows binary
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo build --release --manifest-path app/Cargo.toml
          # Both programs in one archive. The listener resolves the worker from
          # its own path, so a download carrying only screenx.exe has a tray
          # icon and two shortcuts that do nothing at all.
          $files = 'app/target/release/screenx.exe',
                   'app/target/release/screenx-capture.exe'
          Compress-Archive -Force -Path $files -DestinationPath ScreenX_windows.zip
          gh release upload "${{ github.ref_name }}" ScreenX_windows.zip --clobber
