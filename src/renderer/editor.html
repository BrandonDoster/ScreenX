<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ScreenX Editor</title>
  <link rel="stylesheet" href="app.css">
  <style>
    body { display: flex; flex-direction: column; }

    .toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 12px;
               border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .toolbar .sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }

    .tool { width: 34px; height: 32px; padding: 0; display: grid; place-items: center; font-size: 15px; }
    .tool.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .swatches { display: flex; gap: 4px; }
    .swatch { width: 20px; height: 20px; border-radius: 4px; border: 1px solid rgba(255,255,255,.25); cursor: pointer; }
    .swatch.active { outline: 2px solid var(--text); outline-offset: 1px; }

    input[type="color"] { width: 28px; height: 24px; padding: 0; border: 1px solid var(--border);
                          background: var(--bg-input); border-radius: 4px; cursor: pointer; }
    input[type="range"] { width: 96px; }

    #stageWrap { flex: 1; overflow: auto; background: #101114; display: grid; place-items: center; padding: 20px; }
    #stageBox { position: relative; line-height: 0; box-shadow: 0 6px 26px rgba(0,0,0,.55); }
    #stage { display: block; background: #fff; cursor: crosshair; }
    #stage.picking { cursor: default; }
    #textInput { position: absolute; display: none; background: transparent; border: 1px dashed var(--accent);
                 color: #000; outline: none; resize: none; overflow: hidden; padding: 2px 3px;
                 line-height: 1.2; white-space: pre; user-select: text; }

    footer { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
    #info { flex: 1; color: var(--text-dim); font-size: 12px; }
  </style>
</head>
<body>
  <div class="toolbar" id="tools"></div>

  <div class="toolbar" id="options">
    <label for="strokeColor">Colour</label>
    <input type="color" id="strokeColor" value="#e5484d">
    <div class="swatches" id="swatches"></div>
    <div class="sep"></div>
    <label for="fillMode">Fill</label>
    <select id="fillMode" style="width:auto">
      <option value="none">None</option>
      <option value="solid">Solid</option>
    </select>
    <div class="sep"></div>
    <label for="lineWidth">Size</label>
    <input type="range" id="lineWidth" min="1" max="24" value="3">
    <span id="lineWidthValue" class="hint">3</span>
    <div class="sep"></div>
    <label for="fontSize">Text</label>
    <input type="range" id="fontSize" min="10" max="96" value="28">
    <span id="fontSizeValue" class="hint">28</span>
  </div>

  <div id="stageWrap">
    <div id="stageBox">
      <canvas id="stage"></canvas>
      <textarea id="textInput" spellcheck="false"></textarea>
    </div>
  </div>

  <footer>
    <button id="undo" title="Undo (Ctrl/Cmd+Z)">Undo</button>
    <button id="redo" title="Redo (Ctrl/Cmd+Shift+Z)">Redo</button>
    <button id="zoom" title="Toggle zoom">Fit</button>
    <div id="info"></div>
    <button id="copy" title="Copy image (Ctrl/Cmd+C)">Copy</button>
    <button id="saveAs" title="Save as... (Ctrl/Cmd+Shift+S)">Save As...</button>
    <button id="save" class="primary" title="Save (Ctrl/Cmd+S)">Save</button>
  </footer>

  <script src="editor.js"></script>
</body>
</html>
