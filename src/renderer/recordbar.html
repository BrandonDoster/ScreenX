<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Recording</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
                 font: 13px/1 -apple-system, "Segoe UI", system-ui, sans-serif; user-select: none; }
    #bar { display: flex; align-items: center; gap: 10px; height: 44px; margin: 6px;
           padding: 0 12px; border-radius: 22px; background: rgba(24,25,28,.94);
           border: 1px solid rgba(255,255,255,.12); color: #e6e7ea; -webkit-app-region: drag; }
    #dot { width: 10px; height: 10px; border-radius: 50%; background: #e5484d; animation: pulse 1.4s infinite; }
    @keyframes pulse { 50% { opacity: .25; } }
    #time { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; min-width: 46px; }
    #frames { color: #9aa0a8; font-size: 11px; flex: 1; }
    button { -webkit-app-region: no-drag; font: inherit; border: 0; border-radius: 14px;
             padding: 6px 12px; cursor: pointer; color: #fff; background: #e5484d; }
    button.ghost { background: rgba(255,255,255,.12); }
    #bar.encoding #dot { animation: none; background: #3d8bfd; }
  </style>
</head>
<body>
  <div id="bar">
    <div id="dot"></div>
    <div id="time">0:00</div>
    <div id="frames"></div>
    <button id="stop">Stop</button>
    <button id="cancel" class="ghost">✕</button>
  </div>
  <script src="recordbar.js"></script>
</body>
</html>
