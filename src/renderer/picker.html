<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pick a window</title>
  <link rel="stylesheet" href="app.css">
  <style>
    body { display: flex; flex-direction: column; }
    header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: center; }
    header h1 { font-size: 14px; margin: 0; flex: 1; }
    #grid { flex: 1; overflow: auto; padding: 16px; display: grid; gap: 14px;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); align-content: start; }
    .card { background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius);
            overflow: hidden; cursor: pointer; }
    .card:hover, .card.active { border-color: var(--accent); }
    .card .shot { height: 140px; background: #0e0f11; display: flex; align-items: center; justify-content: center; }
    .card img.shot-img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .card .meta { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-top: 1px solid var(--border); }
    .card .meta img { width: 16px; height: 16px; }
    .card .meta span { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #empty { padding: 40px; text-align: center; color: var(--text-dim); }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Pick a window</h1>
    <input type="text" id="filter" class="grow" placeholder="Filter by title..." style="max-width:260px">
    <button id="cancel">Cancel</button>
  </header>
  <div id="grid"></div>
  <script src="picker.js"></script>
</body>
</html>
